name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (single-config)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUAII_BUILD_TESTS=ON -DUAII_BUILD_PLUGINS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DUAII_BUILD_TESTS=ON -DUAII_BUILD_PLUGINS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CLI demos
        shell: bash
        run: |
          set -e
          BIN=""
          for c in \
            build/uaii \
            build/Release/uaii \
            build/Release/uaii.exe \
            build/libs/uaii-cli/uaii \
            build/libs/uaii-cli/Release/uaii.exe
          do
            if [[ -x "$c" || -f "$c" ]]; then
              BIN="$c"
              break
            fi
          done
          if [[ -z "$BIN" ]]; then
            echo "uaii binary not found" >&2
            find build -name 'uaii*' -type f | head
            exit 1
          fi
          echo "Using $BIN"
          "$BIN" version
          "$BIN" doctor --load-plugins
          "$BIN" validate examples/ir/toy_mlp.uaii.json
          "$BIN" run --demo toy_mlp
          "$BIN" run --demo optimize || true
          "$BIN" run --demo streaming || true
          "$BIN" run --demo parity || true

  cuda-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit (compile-only)
        run: |
          # Soft: skip if toolkit install fails on runner; job continues as optional matrix
          sudo apt-get update -y || true
          sudo apt-get install -y nvidia-cuda-toolkit || true
      - name: Configure with CUDA if nvcc present
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            cmake -S . -B build-cuda -DCMAKE_BUILD_TYPE=Release -DUAII_WITH_CUDA=ON -DUAII_BUILD_TESTS=ON
            cmake --build build-cuda --parallel
            ctest --test-dir build-cuda -C Release --output-on-failure || true
          else
            echo "nvcc not available; skipping CUDA compile"
          fi

  onednn-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install oneDNN if available (optional CPU GEMM path)
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y libdnnl-dev || true
      - name: Configure with oneDNN when headers present
        run: |
          if [ -f /usr/include/dnnl/dnnl.hpp ] || pkg-config --exists dnnl 2>/dev/null; then
            cmake -S . -B build-onednn -DCMAKE_BUILD_TYPE=Release -DUAII_WITH_ONEDNN=ON -DUAII_BUILD_TESTS=ON
            cmake --build build-onednn --parallel
            ctest --test-dir build-onednn -C Release --output-on-failure || true
          else
            echo "oneDNN (DNNL) not available; skipping optional GEMM backend compile"
          fi

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install & build static site
        working-directory: website
        run: |
          npm ci
          npm run build

  dependabot:
    # Placeholder job name kept for visibility; Dependabot is configured via .github/dependabot.yml
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dependabot config present"
