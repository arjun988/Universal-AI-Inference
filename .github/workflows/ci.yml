name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (single-config)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUAII_BUILD_TESTS=ON -DUAII_BUILD_PLUGINS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DUAII_BUILD_TESTS=ON -DUAII_BUILD_PLUGINS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CLI demos
        shell: bash
        run: |
          set -e
          BIN=""
          for c in \
            build/uaii \
            build/Release/uaii \
            build/Release/uaii.exe \
            build/libs/uaii-cli/uaii \
            build/libs/uaii-cli/Release/uaii.exe
          do
            if [[ -x "$c" || -f "$c" ]]; then
              BIN="$c"
              break
            fi
          done
          if [[ -z "$BIN" ]]; then
            echo "uaii binary not found" >&2
            find build -name 'uaii*' -type f | head
            exit 1
          fi
          echo "Using $BIN"
          "$BIN" version
          "$BIN" doctor --load-plugins
          "$BIN" validate examples/ir/toy_mlp.uaii.json
          "$BIN" run --demo toy_mlp
          "$BIN" run --demo optimize || true
          "$BIN" run --demo streaming || true
          "$BIN" run --demo parity || true

  cuda-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit (compile-only)
        run: |
          # Soft: skip if toolkit install fails on runner; job continues as optional matrix
          sudo apt-get update -y || true
          sudo apt-get install -y nvidia-cuda-toolkit || true
      - name: Configure with CUDA if nvcc present
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            cmake -S . -B build-cuda -DCMAKE_BUILD_TYPE=Release \
              -DUAII_WITH_CUDA=ON -DUAII_BUILD_TESTS=ON \
              -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89"
            cmake --build build-cuda --parallel
            ctest --test-dir build-cuda -C Release --output-on-failure || true
          else
            echo "nvcc not available; skipping CUDA compile"
          fi

  onednn-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install oneDNN if available (optional CPU GEMM path)
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y libdnnl-dev || true
      - name: Configure with oneDNN when headers present
        run: |
          if [ -f /usr/include/dnnl/dnnl.hpp ] || pkg-config --exists dnnl 2>/dev/null; then
            cmake -S . -B build-onednn -DCMAKE_BUILD_TYPE=Release -DUAII_WITH_ONEDNN=ON -DUAII_BUILD_TESTS=ON
            cmake --build build-onednn --parallel
            ctest --test-dir build-onednn -C Release --output-on-failure || true
          else
            echo "oneDNN (DNNL) not available; skipping optional GEMM backend compile"
          fi

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install & build static site
        working-directory: website
        run: |
          npm ci
          npm run build

  # Absolute kernel microbenchmarks (uaii_bench). Uploads JSON for citation;
  # not a bake-off vs other runtimes. See docs/benchmarks.md.
  benchmarks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vendor GEMM libs (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libdnnl-dev libopenblas-dev || true

      - name: Configure (single-config)
        if: runner.os != 'Windows'
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            EXTRA="-DUAII_WITH_ONEDNN=ON -DUAII_WITH_OPENBLAS=ON"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUAII_BUILD_TESTS=OFF \
            -DUAII_BUILD_PLUGINS=OFF \
            -DUAII_BUILD_BENCHMARKS=ON \
            $EXTRA

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DUAII_BUILD_TESTS=OFF
          -DUAII_BUILD_PLUGINS=OFF
          -DUAII_BUILD_BENCHMARKS=ON

      - name: Build uaii_bench
        run: cmake --build build --config Release --target uaii_bench --parallel

      - name: Detect CPU label
        id: cpu
        shell: bash
        run: |
          set -euo pipefail
          label=""
          case "${RUNNER_OS}" in
            Linux)
              label="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^[[:space:]]*//')"
              ;;
            macOS)
              label="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
              ;;
            Windows)
              label="$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r')"
              ;;
          esac
          if [[ -z "${label}" ]]; then
            label="GitHub Actions ${RUNNER_OS} (${RUNNER_ARCH})"
          fi
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          echo "CPU: ${label}"

      - name: Run microbenchmarks
        shell: bash
        env:
          UAII_BENCH_CPU: ${{ steps.cpu.outputs.label }}
        run: |
          set -euo pipefail
          BIN=""
          for c in \
            build/benchmarks/uaii_bench \
            build/benchmarks/Release/uaii_bench \
            build/benchmarks/uaii_bench.exe \
            build/benchmarks/Release/uaii_bench.exe
          do
            if [[ -x "$c" || -f "$c" ]]; then
              BIN="$c"
              break
            fi
          done
          if [[ -z "$BIN" ]]; then
            echo "uaii_bench binary not found" >&2
            find build -name 'uaii_bench*' -type f | head
            exit 1
          fi
          mkdir -p benchmarks/results
          os_slug="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          out="benchmarks/results/ci_${os_slug}_${GITHUB_SHA::12}.json"
          echo "Using $BIN → $out"
          "$BIN" --suite all --providers all --trials 21 --warmup 5 --json | tee "$out"
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" - "$out" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("schema") == "uaii_bench/v3", data.get("schema")
          gemm = data.get("gemm_by_provider") or []
          assert gemm, "missing gemm_by_provider"
          for prov in gemm:
              for row in prov.get("sizes") or []:
                  assert float(row.get("gflops_median", 0)) > 0, row
          print("linked:", data.get("linked_providers"))
          print("sanity ok:", path)
          PY
          echo "result_path=${out}" >> "$GITHUB_ENV"

      - name: Job summary
        if: always() && env.result_path != ''
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" - "${{ env.result_path }}" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              d = json.load(f)
          lines = [
              "## UAII microbenchmarks (v3)",
              "",
              f"- **Runner:** {os.environ.get('RUNNER_OS')} / {os.environ.get('RUNNER_ARCH')}",
              f"- **CPU:** {d.get('cpu', '?')}",
              f"- **Linked providers:** `{d.get('linked_providers', [])}`",
              f"- **Build:** {d.get('build', '?')}",
              f"- **Trials:** {d.get('trials_default', '?')} (median)",
              "",
          ]
          for prov in d.get("gemm_by_provider") or []:
              lines += [
                  f"### GEMM `{prov.get('provider')}` ({prov.get('name')})",
                  "",
                  "| N | Median ms | GFLOP/s |",
                  "|---:|---:|---:|",
              ]
              for row in prov.get("sizes") or []:
                  ms = (row.get("uaii_ms") or {}).get("median_ms", "?")
                  lines.append(f"| {row.get('n')} | {ms} | **{row.get('gflops_median')}** |")
              lines.append("")
          bw = d.get("bandwidth") or {}
          if bw.get("kernels"):
              lines += ["### Bandwidth", "", "| Kernel | GB/s |", "|---|---:|"]
              for k in bw["kernels"]:
                  lines.append(f"| {k.get('name')} | **{k.get('gbps_median')}** |")
              lines.append("")
          attn = d.get("attention") or {}
          if attn:
              e2e = (attn.get("e2e_ms") or {}).get("median_ms", "?")
              lines += [f"**Attention** e2e median: **{e2e} ms**", ""]
          lines += [
              f"Artifact JSON: `{path}`",
              "",
              "> Kernel microbenchmarks only — not LLM tokens/s.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: uaii-bench-${{ matrix.os }}-${{ github.sha }}
          path: benchmarks/results/ci_*.json
          if-no-files-found: error
          retention-days: 90

  dependabot:
    # Placeholder job name kept for visibility; Dependabot is configured via .github/dependabot.yml
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dependabot config present"
