name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (single-config)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUAII_BUILD_TESTS=ON -DUAII_BUILD_PLUGINS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DUAII_BUILD_TESTS=ON -DUAII_BUILD_PLUGINS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CLI demos
        shell: bash
        run: |
          set -e
          BIN=""
          for c in \
            build/uaii \
            build/Release/uaii \
            build/Release/uaii.exe \
            build/libs/uaii-cli/uaii \
            build/libs/uaii-cli/Release/uaii.exe
          do
            if [[ -x "$c" || -f "$c" ]]; then
              BIN="$c"
              break
            fi
          done
          if [[ -z "$BIN" ]]; then
            echo "uaii binary not found" >&2
            find build -name 'uaii*' -type f | head
            exit 1
          fi
          echo "Using $BIN"
          "$BIN" version
          "$BIN" doctor --load-plugins
          "$BIN" validate examples/ir/toy_mlp.uaii.json
          "$BIN" run --demo toy_mlp
          "$BIN" run --demo optimize || true
          "$BIN" run --demo parity || true

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install & build static site
        working-directory: website
        run: |
          npm ci
          npm run build

  dependabot:
    # Placeholder job name kept for visibility; Dependabot is configured via .github/dependabot.yml
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dependabot config present"
